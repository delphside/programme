# What every application in the programme shares. Read by the programme's
# tooling through scripts/board/profile.py (delphside/tile-lite-elite#485,
# stage 2). An application's own facts are in its programme profile
# (applications/<app>/3.n.6-profile.md) and its technical profile
# (app-profile.toml at its repository's root).
#
# Issue types, field names and option strings are still in the tooling's model.

[organisation]
# The GitHub organisation that owns every repository and the board.
login = "delphside"
# The repositories the board must hold. `board-add.py` adds the open items of
# every repository the organisation lists; one named here and not listed is
# reported, because a repository the token cannot see is left out, not empty.
# `board-digest.py` reads the open pull requests of each one other than the
# application's own, and of `programme.repository`, for what is waiting on the
# owner. Remove a repository from here when it is archived.
repositories = ["dark-portal", "infrastructure", "programme", "service-desk", "tile-lite-elite"]

[board]
# The one programme board.
project_id = "PVT_kwDOEyOvmc4BhpOl"

[accounts]
# The owner's GitHub account: the default reviewer of a pull request.
owner = "SteveStyle"
# The account Claude's `gh` authenticates as, so a comment's author says who typed it.
machine_user = "SteveStyle-typed-by-Claude"
# The bot that opens the scheduled workflows' reports.
bot = "github-actions"
# How the hook messages name the owner.
owner_name = "Steve"

[comments]
# Comments made before this date are never a to-do: Claude's account began on
# 2026-08-25, so an earlier comment was never Claude's to answer (owner,
# 2026-11-13). Read by `board/inbox.py`.
to_do_floor = "2026-08-25"
# How long after a denied comment the same post to the same issue is allowed, in
# minutes: ample to read the reason and rewrite the comment within a turn (chosen
# 2026-11-13, no measurement behind it); revisit if a retry is ever denied for
# being late. Read by `.claude/hooks/comment-check.sh`.
retry_minutes = 10

[flow]
# The daily sweep (`board/flow.py`, `board-flow.py`), delphside/programme#176.
# Each REST call is cut at this long, in seconds. The figure is `sources.py`'s
# own for its REST reads before the sweep existed.
rest_timeout_seconds = 120
# How many items are read at once; each item's own reads (sub-issues,
# dependencies, timeline, reviews) run one after another. A hundred items took
# over two minutes read one at a time (measured 2026-11-15); GitHub's limit on
# concurrent requests is well above this.
read_workers = 8
# How far back a merged pull request is read for the `Refs #N` it carries, to
# catch a merge whose work package was not moved: a pull request counts when it
# merged within this many days. A missed week of sweeps is tolerated; the figure
# has no measurement behind it (chosen 2026-11-15).
merged_lookback_days = 30

[flow.field_ids]
# The organisation's id for each issue field, by name (REST writes take an id),
# read from the issues' own `issue_field_values` on 2026-11-15, except `Turn`,
# which the owner created and gave the handover. `Claimed by` is a text field
# whose id is not yet known: it is absent until it is set here, and until then
# the sweep takes it from an issue that carries a value, or fails the write
# naming it. A name missing here is learned the same way.
"Turn" = 49935304
"Project State" = 46162136
"Requirement State" = 46185224
"Decision State" = 46531431
"Ticket State" = 48733274
"Workstream" = 46217763
"Route" = 46415058

[programme]
# The programme repository, the default place of its live checkout relative to
# an application's main worktree, and the submodule path in an application.
repository = "delphside/programme"
live_default = "../programme"
submodule = "programme"

[records]
# Paths inside the programme repository. The register is read from the pinned
# submodule; the log and the digests are records, read from the live checkout.
activity_register = "docs/1.4-programme-activities.md"
activity_log = "records/2.3-activity-log.csv"
# The problem and continual improvement registers, a record the digest reports.
improvement_registers = "records/2.7-improvement-registers.md"
weekly_digest = "records/2.4-weekly-digest"
# A weekly digest is programme-wide: <code>_<yyyy>_W<ww>.md.
weekly_digest_code = "PRG_WD"

[programme_documents]
# The programme's documents that an application's repository holds, which change
# on main and never on a project's branch, except a pin move committed on its own
# (`documents.refused_on_branch`). The tooling adds the submodule (the
# pin) and everything inside it; an application adds its own in its technical
# profile (`documents.programme_exact`, `documents.programme_prefixes`).
exact = ["CLAUDE.md", "AGENTS.md", "docs/README.md"]
# The programme's register of tooling, inside the programme repository: a new
# script or skill must be named in it or in the application's.
tools_register = "docs/1.1-programme-tooling.md"
